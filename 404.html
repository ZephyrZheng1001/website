<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面不存在 | Zephyr</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: #fafaf8;
  color: #1e2d2b;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; text-align: center; padding: 24px;
}
.wrap { max-width: 480px; }
.code {
  font-size: 6rem; font-weight: 800; color: #2d8a7b;
  line-height: 1; margin-bottom: 8px;
}
.title { font-size: 1.4rem; font-weight: 600; margin-bottom: 12px; }
.desc { color: #6b7f7c; font-size: 0.95rem; line-height: 1.7; margin-bottom: 32px; }
.links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.links a {
  display: inline-block; padding: 10px 24px; border-radius: 6px;
  background: #2d8a7b; color: #fff; text-decoration: none;
  font-size: 0.9rem; font-weight: 500; transition: background 0.2s;
}
.links a:hover { background: #236b60; }
.links a.outline {
  background: transparent; border: 1.5px solid #e5eae8; color: #1e2d2b;
}
.links a.outline:hover { background: #f0f4f3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <div class="title">页面不存在</div>
  <p class="desc">你访问的页面可能已被移动、删除，<br>或者你输入了错误的地址。</p>
  <div class="links">
    <a href="/">返回首页</a>
    <a href="/#/blog" class="outline">技术文章</a>
  </div>
</div>
</body>
</html>
